<!DOCTYPE html>
<html lang="en">

<head>
    <title>Selectors:3.Class Selector </title>
    <style>
        .skyblue-bg-color {
            color: white;
            background-color: skyblue;
        }
        .blue-bg-color{
            color: white;
            background-color: blue;
        }
        .middle-text{
            text-align: center;
        }
    </style>

</head>

<body>
    <h1 class="skyblue-bg-color middle-text">
        Welcome to My Website
    </h1>
    <h1 class="blue-bg-color">
        Menu:
    </h1>
    <ol>
        <li class="skyblue-bg-color">Java</li>
        <li class="blue-bg-color">Python</li>
    </ol>
    <br><br><br><br><br><br><br><br><br><br><br><br><br>
    <h4 class="skyblue-bg-color middle-text">
        Thank you for visiting my web site
    </h4>
</body>

</html>
