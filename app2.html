<!DOCTYPE html>
<html>
<head>
  <title>Relative Example</title>
  <style>
    .box {
      width: 100px;
      height: 100px;
      background: blue;
      position: relative;
      top: 100px;
      left: 100px;
    }

    .text {
      background: lightgray;
    }
  </style>
</head>
<body>

<h2>Relative Position</h2>

<div class="box"></div>
<p class="text">Notice the gap where the box originally was.</p>

</body>
</html>
