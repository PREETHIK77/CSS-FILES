<!DOCTYPE html>
<html lang="en">

<head>
    <title>Selectors:2.ID Selector </title>
    <style>
        #first-h1 {
            background-color: blueviolet;
            color: white;
            text-align: center;
        }
        #second-h1 {
            background-color: blue;
            color: white;
        }
        #lang1{
            color: red;
        }

        h4 {
            color: blue;
            background-color: yellow;
        }
    </style>

</head>

<body>
    <h1 id="first-h1">
        Welcome to My Website
    </h1>
    <h1 id="second-h1">
        Menu:
    </h1>
    <ol>
        <li id="lang1">Java</li>
        <li id="lang2">Python</li>
        <li id="lang3">JS</li>
    </ol>
    <br><br><br><br><br><br><br><br><br><br><br><br><br>
    <h4>
        Thank you for visiting my web site
    </h4>
</body>

</html>
