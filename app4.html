<!DOCTYPE html>
<html>
<head>
  <title>Fixed Example</title>
  <style>
    .box {
      width: 120px;
      height: 50px;
      background: orange;
      position: fixed;
      bottom: 10px;
      right: 10px;
    }

    .content {
      height: 1500px;
    }
  </style>
</head>
<body>

<h2>Fixed Position</h2>

<div class="box">I stay here</div>

<div class="content">
  Scroll down this page...
</div>

</body>
</html>
