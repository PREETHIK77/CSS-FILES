<!DOCTYPE html>
<html lang="en">

<head>
    <title>Inline CSS vs Internal CSS</title>
    <!--Internal CSS-->
    <style>
        h3 {
            background-color: blueviolet;
            color: white;
        }

        input {
            color: blue;
            background-color: silver;
        }
    </style>

</head>

<body>
    <!--Inline CSS-->
    <h2 style="background-color: brown;color: whitesmoke;">Good morning</h2>
    <h2 style="background-color: brown;color: whitesmoke;">Good afternoon</h2>
    <h2 style="background-color: brown;color: whitesmoke;">Good evening</h2>

    <h3>Welcome to Html</h3>
    <h3>Welcome to Css</h3>
    <h3>Welocme to Js</h3>

    <input type="text" placeholder="Type Ur Name Here">
    <br><br>
    <input type="text" placeholder="Type ur City Here">
    <br><br>
    <input type="text" placeholder="Type ur Gender Here">
</body>

</html>
