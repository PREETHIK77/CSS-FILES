<!DOCTYPE html>
<html>
<head>
  <title>Sticky Example</title>
  <style>
    .header {
      background: yellow;
      padding: 10px;
      position: sticky;
      top: 10px;
    }

    .content {
      height: 1500px;
    }
  </style>
</head>
<body>

<h2>Sticky Position</h2>

<div class="header">I stick to top when scrolling</div>

<div class="content">
  Scroll down to see effect...
</div>

</body>
</html>
