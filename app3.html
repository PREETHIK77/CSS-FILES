<!DOCTYPE html>
<html>
<head>
  <title>Absolute Example</title>
  <style>
    .container {
      width: 300px;
      height: 200px;
      background: lightgray;
      position: relative;
    }

    .box {
      width: 100px;
      height: 100px;
      background: green;
      position: absolute;
      top: 20px;
      right: 20px;
    }
  </style>
</head>
<body>

<h2>Absolute Position</h2>

<div class="container">
  <div class="box"></div>
</div>

<p>The box is positioned inside the container.</p>

</body>
</html>
